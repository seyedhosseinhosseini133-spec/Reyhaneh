<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reyhaneh — My Little World</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bg: #fdf8f6;
    --fg: #2b2330;
    --glass-bg: rgba(255,255,255,.55);
    --glass-bd: rgba(255,255,255,.75);
    --glass-sh: 0 10px 40px -12px rgba(170,120,170,.25);
  }
  html.dark {
    --bg: #0f0d16;
    --fg: #ece8f4;
    --glass-bg: rgba(32,27,45,.55);
    --glass-bd: rgba(255,255,255,.09);
    --glass-sh: 0 10px 40px -12px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Manrope', 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    transition: background-color .6s, color .6s;
    overflow-x: hidden;
    margin: 0;
    min-height: 100vh;
  }
  [dir="rtl"] body { font-family: 'Vazirmatn', 'Manrope', sans-serif; }

  .font-serif, h1, h2, h3.serif { font-family: 'Cormorant Garamond', 'Vazirmatn', serif; }
  [dir="rtl"] .font-serif { font-family: 'Vazirmatn', serif; letter-spacing: 0 !important; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid var(--glass-bd);
    box-shadow: var(--glass-sh);
  }

  .grad-text {
    background-image: linear-gradient(115deg,#e887b3 0%,#b98ce4 45%,#8fb9e8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  html.dark .grad-text {
    background-image: linear-gradient(115deg,#ff9ec7 0%,#c9a4ff 45%,#a8cdff 100%);
  }

  .orb {
    position: fixed; border-radius: 9999px; filter: blur(90px);
    opacity: .45; pointer-events: none; z-index: 0;
    animation: floatBlob 22s ease-in-out infinite;
  }
  html.dark .orb { opacity: .30; }

  @keyframes floatBlob {
    0%,100% { transform: translate3d(0,0,0) scale(1); }
    33%     { transform: translate3d(24px,-30px,0) scale(1.07); }
    66%     { transform: translate3d(-18px,16px,0) scale(.96); }
  }
  @keyframes floatY {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-14px); }
  }
  @keyframes twinkle {
    0%,100% { opacity:.15; transform: scale(.7); }
    50%     { opacity:1;   transform: scale(1.15); }
  }
  @keyframes storyProg { from { width:0% } to { width:100% } }
  @keyframes spinSlow  { to { transform: rotate(360deg); } }

  .animate-float     { animation: floatY 9s ease-in-out infinite; }
  .animate-spin-slow { animation: spinSlow 26s linear infinite; }
  .animate-twinkle   { animation: twinkle 4s ease-in-out infinite; }

  /* Loader */
  #loader {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background:
      radial-gradient(1200px 600px at 20% 10%, rgba(244,190,214,.55), transparent 60%),
      radial-gradient(1000px 600px at 80% 90%, rgba(196,178,240,.55), transparent 60%),
      linear-gradient(160deg, #fdf8f6 0%, #f7eef7 50%, #eef1fb 100%);
    transition: opacity .9s ease, transform .9s ease;
  }
  html.dark #loader {
    background:
      radial-gradient(1200px 600px at 20% 10%, rgba(120,60,110,.35), transparent 60%),
      radial-gradient(1000px 600px at 80% 90%, rgba(90,70,160,.35), transparent 60%),
      linear-gradient(160deg, #0f0d16 0%, #14101f 50%, #0d1020 100%);
  }
  #loader.exit { opacity: 0; transform: scale(1.06); pointer-events: none; }

  /* Masonry */
  .masonry { column-count: 2; column-gap: 14px; }
  @media (min-width: 640px)  { .masonry { column-count: 3; column-gap: 18px; } }
  @media (min-width: 1280px) { .masonry { column-count: 4; } }
  .masonry-item { break-inside: avoid; margin-bottom: 14px; }
  @media (min-width: 640px) { .masonry-item { margin-bottom: 18px; } }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Range slider */
  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(90deg,#f0a6c6,#b98ce4);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 14px; width: 14px; border-radius: 999px;
    background: #fff; margin-top: -5px; box-shadow: 0 2px 8px rgba(180,120,180,.45);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 4px; border-radius: 999px; background: linear-gradient(90deg,#f0a6c6,#b98ce4);
  }
  input[type="range"]::-moz-range-thumb {
    height: 14px; width: 14px; border: none; border-radius: 999px;
    background: #fff; box-shadow: 0 2px 8px rgba(180,120,180,.45); cursor: pointer;
  }

  /* Reveal */
  .reveal {
    opacity: 0;
    transform: translate3d(0, 26px, 0);
    transition: opacity .95s cubic-bezier(.2,.7,.2,1), transform .95s cubic-bezier(.2,.7,.2,1);
  }
  .reveal.in {
    opacity: 1;
    transform: translate3d(0,0,0);
  }

  /* Story bar */
  .story-bar { animation-name: storyProg; animation-timing-function: linear; animation-fill-mode: forwards; }
</style>
</head>
<body>

<!-- ═══════════ LOADER ═══════════ -->
<div id="loader">
  <div id="loaderParticles" style="position:absolute; inset:0; overflow:hidden;"></div>
  <div style="position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; padding:0 2rem;">
    <div style="position:relative;">
      <div style="position:absolute; inset:-2rem; border-radius:9999px; filter:blur(48px); opacity:.7; background:radial-gradient(circle,#f6bcd6,#c9a4ff 60%,transparent 75%);"></div>
      <div class="glass" style="position:relative; width:112px; height:112px; border-radius:9999px; display:grid; place-items:center; box-shadow:0 0 60px rgba(210,150,220,.45);">
        <span class="font-serif grad-text" style="font-size:3rem; font-weight:600;">R</span>
        <span class="animate-spin-slow" style="position:absolute; inset:-10px; border-radius:9999px; border:1px solid rgba(255,255,255,.6); border-top-color:transparent; border-right-color:transparent;"></span>
      </div>
    </div>
    <h1 style="margin-top:2.25rem; font-size:26px; letter-spacing:.42em; padding-left:.42em;" class="font-serif">
      <span id="loaderLetters"></span>
    </h1>
    <p style="margin-top:.5rem; font-size:10px; letter-spacing:.35em; text-transform:uppercase; opacity:.5;">my little world</p>
    <div style="margin-top:2.5rem; width:224px; height:3px; border-radius:9999px; overflow:hidden; background:rgba(0,0,0,.1);">
      <div id="loaderBar" style="height:100%; border-radius:9999px; width:0%; background:linear-gradient(90deg,#f0a6c6,#b98ce4,#8fb9e8); transition:width .2s ease-out;"></div>
    </div>
    <div id="loaderPct" style="margin-top:.75rem; font-size:11px; letter-spacing:.25em; opacity:.6; font-variant-numeric:tabular-nums;">000%</div>
  </div>
</div>

<!-- ═══════════ BACKGROUND ORBS ═══════════ -->
<div class="orb" style="width:420px;height:420px;top:-8%;left:-8%;background:#f6bcd6;"></div>
<div class="orb" style="width:380px;height:380px;top:28%;right:-10%;background:#c9a4ff;animation-delay:-6s;"></div>
<div class="orb" style="width:460px;height:460px;bottom:-12%;left:18%;background:#a8cdff;animation-delay:-12s;"></div>

<!-- ═══════════ TOP BAR ═══════════ -->
<header style="position:fixed; top:0; left:0; right:0; z-index:50; padding:1rem 1rem 0; pointer-events:none;">
  <div style="max-width:72rem; margin:0 auto; display:flex; align-items:center; justify-content:space-between;">
    <div class="glass" style="pointer-events:auto; width:44px; height:44px; border-radius:1rem; display:grid; place-items:center;">
      <span class="font-serif grad-text" style="font-size:1.25rem; font-weight:600;">R</span>
    </div>
    <div style="pointer-events:auto; display:flex; align-items:center; gap:.5rem;">
      <button id="langBtn" class="glass" style="height:44px; padding:0 .875rem; border-radius:1rem; display:flex; align-items:center; gap:.5rem; font-size:11px; font-weight:500; letter-spacing:.1em; cursor:pointer; color:inherit; transition:transform .3s;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3.2 2.6 14.8 0 18M12 3c-2.6 3.2-2.6 14.8 0 18"/></svg>
        <span id="langLabel">فا</span>
      </button>
      <button id="themeBtn" class="glass" aria-label="Toggle theme" style="width:44px; height:44px; border-radius:1rem; display:grid; place-items:center; cursor:pointer; color:inherit; transition:transform .3s;">
        <span id="themeIcon" style="display:inline-block; transition:transform .6s cubic-bezier(.5,-.3,.3,1.4);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2M12 19.8v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.2 12h2M19.8 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </div>
</header>

<!-- ═══════════ MAIN ═══════════ -->
<main style="position:relative; z-index:10;">

  <!-- HERO -->
  <section id="home" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:7rem 1.5rem 8rem; scroll-margin-top:6rem;">
    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; max-width:48rem; width:100%;">
      <div class="reveal" style="transition-delay:.06s;">
        <div class="glass" style="display:inline-flex; align-items:center; gap:.5rem; padding:.375rem 1rem; border-radius:9999px; font-size:10px; letter-spacing:.28em; text-transform:uppercase;">
          <span style="width:6px; height:6px; border-radius:9999px; background:#f472b6; animation:pulse 2s infinite;"></span>
          <span data-en="Personal Digital Diary" data-fa="دفتر خاطرات دیجیتال"></span>
        </div>
      </div>

      <div class="reveal animate-float" style="margin-top:2.25rem; position:relative; width:160px; height:160px; transition-delay:.16s;">
        <div style="position:absolute; inset:0; border-radius:9999px; filter:blur(24px); opacity:.6; background:radial-gradient(circle,#f6bcd6,#c9a4ff 60%,transparent 75%);"></div>
        <div class="animate-spin-slow" style="position:absolute; inset:-14px; border-radius:9999px; border:1px dashed rgba(244,114,182,.5);"></div>
        <img id="heroImg" alt="Reyhaneh" style="position:relative; width:100%; height:100%; object-fit:cover; border-radius:9999px; box-shadow:0 0 0 4px rgba(255,255,255,.8), 0 25px 50px -12px rgba(0,0,0,.25);" />
      </div>

      <div class="reveal" style="margin-top:1.75rem; display:flex; align-items:center; gap:.75rem; transition-delay:.26s;">
        <span style="height:1px; width:32px; background:linear-gradient(to right,transparent,rgba(244,114,182,.6));"></span>
        <span id="heroName" style="font-size:11px; letter-spacing:.42em; text-transform:uppercase; opacity:.7;"></span>
        <span style="height:1px; width:32px; background:linear-gradient(to left,transparent,rgba(244,114,182,.6));"></span>
      </div>

      <h1 class="reveal font-serif" style="margin-top:1rem; font-size:2.6rem; line-height:1.08; transition-delay:.34s;">
        <span data-en="Welcome to" data-fa="به دنیای کوچک من"></span>
        <span class="grad-text" style="font-style:italic;" data-en="My Little World" data-fa="خوش اومدی"></span>
      </h1>

      <p class="reveal" style="margin-top:1.5rem; font-size:.875rem; line-height:1.7; opacity:.7; max-width:36rem; transition-delay:.44s;"
         data-en="A soft little corner of the internet where my memories, dreams and favourite moments quietly live."
         data-fa="یه گوشهٔ نرم از اینترنت که خاطره‌ها، رؤیاها و لحظه‌های موردعلاقه‌ام آروم توش زندگی می‌کنن."></p>

      <button id="exploreBtn" class="reveal" style="margin-top:2.25rem; display:inline-flex; align-items:center; gap:.625rem; padding:.875rem 1.75rem; border-radius:9999px; font-size:.875rem; font-weight:500; color:white; border:none; cursor:pointer; background:linear-gradient(135deg,#f0a6c6,#b98ce4); box-shadow:0 14px 34px -12px rgba(200,130,200,.85); transition:transform .3s; transition-delay:.54s;">
        <span data-en="Explore My World" data-fa="دنیای منو بگرد"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></svg>
      </button>

      <div class="reveal" style="margin-top:3.5rem; display:flex; flex-direction:column; align-items:center; gap:.5rem; opacity:.45; transition-delay:.7s;">
        <span style="font-size:9px; letter-spacing:.3em; text-transform:uppercase;" data-en="Scroll to discover" data-fa="اسکرول کن و کشف کن"></span>
        <span style="width:1px; height:36px; background:linear-gradient(to bottom, currentColor, transparent); animation:floatY 2.4s ease-in-out infinite;"></span>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about" style="position:relative; padding:6rem 1.5rem; scroll-margin-top:6rem;">
    <div style="max-width:72rem; margin:0 auto;">
      <div style="text-align:center; max-width:42rem; margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex; align-items:center; gap:.75rem; font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:rgba(236,72,153,.9);">
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>
            <span data-en="Who I am" data-fa="من کی‌ام"></span>
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>
          </span>
        </div>
        <h2 class="reveal font-serif" style="margin-top:1rem; font-size:3rem; transition-delay:.08s;">
          <span data-en="About Me" data-fa="دربارهٔ من"></span>
        </h2>
      </div>

      <div style="margin-top:3.5rem; display:grid; gap:1.5rem; align-items:start;" class="about-grid">
        <div class="reveal" style="position:relative; transition-delay:.06s;">
          <div style="position:absolute; inset:-12px; border-radius:2.4rem; filter:blur(24px); opacity:.4; background:linear-gradient(135deg,#f6bcd6,#c9a4ff);"></div>
          <img id="aboutImg" alt="about" style="position:relative; width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:2rem; box-shadow:0 20px 40px -12px rgba(0,0,0,.2);" />
          <div class="glass animate-float" style="position:absolute; bottom:-1.5rem; right:-1rem; border-radius:1rem; padding:.75rem 1rem; display:flex; align-items:center; gap:.625rem;">
            <span style="color:#ec4899;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2S4.6 15.7 4.6 10.3A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.4 2.9c0 5.4-7.4 9.9-7.4 9.9z"/></svg></span>
            <span style="font-size:11px; line-height:1.2; opacity:.8;" data-en="little things, big joy" data-fa="چیزهای کوچک، شادی بزرگ"></span>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:1.25rem;">
          <p class="reveal font-serif" style="font-size:1.75rem; line-height:1.3; margin:0; transition-delay:.12s;"
             data-en="I'm Reyhaneh — a dreamer, a collector of small beautiful things, and a lover of quiet mornings."
             data-fa="من ریحانه‌ام — یه رؤیاپرداز، جمع‌کنندهٔ چیزهای کوچک و زیبا، و عاشق صبح‌های آرام."></p>
          <p class="reveal" style="font-size:.9375rem; line-height:1.75; opacity:.7; margin:0; transition-delay:.18s;"
             data-en="I find joy in soft light, old books, the smell of rain, and moments that don't need to be photographed to be remembered. This space is where I keep the little things that make my world feel warm."
             data-fa="شادی رو در نور ملایم، کتاب‌های قدیمی، بوی بارون و لحظه‌هایی پیدا می‌کنم که برای به‌یادموندن نیازی به عکس ندارن. این فضا جاییه که چیزهای کوچیکی که دنیامو گرم می‌کنن نگه می‌دارم."></p>

          <div class="reveal glass" style="border-radius:1.5rem; padding:1.5rem; transition-delay:.24s;">
            <h3 style="font-size:10px; letter-spacing:.28em; text-transform:uppercase; opacity:.55; margin:0 0 1rem 0;" data-en="Little things I love" data-fa="چیزهای کوچیکی که دوست دارم"></h3>
            <div id="interests" style="display:flex; flex-wrap:wrap; gap:.5rem;"></div>
          </div>

          <div class="reveal glass" style="border-radius:1.5rem; padding:1.5rem; transition-delay:.30s;">
            <h3 style="font-size:10px; letter-spacing:.28em; text-transform:uppercase; opacity:.55; margin:0 0 1rem 0;" data-en="Favourites" data-fa="موردعلاقه‌ها"></h3>
            <div id="favorites" style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem;"></div>
          </div>

          <div class="reveal" style="position:relative; border-radius:1.5rem; padding:1.5rem 1.75rem; overflow:hidden; background:linear-gradient(135deg, rgba(240,166,198,.28), rgba(185,140,228,.28)); transition-delay:.36s;">
            <span class="font-serif" style="position:absolute; top:-.75rem; left:1rem; font-size:3.75rem; opacity:.25; user-select:none;">"</span>
            <p class="font-serif" style="position:relative; font-size:1.125rem; font-style:italic; line-height:1.6; margin:0;"
               data-en="This little world is my way of saying: beauty is everywhere, if you slow down enough to notice."
               data-fa="این دنیای کوچک، راه منه برای گفتن این که: زیبایی همه‌جا هست، اگر به‌قدر کافی آرام بشی تا ببینیش."></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- GALLERY -->
  <section id="gallery" style="position:relative; padding:6rem 1rem; scroll-margin-top:6rem;">
    <div style="max-width:72rem; margin:0 auto;">
      <div style="text-align:center; max-width:42rem; margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex; align-items:center; gap:.75rem; font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:rgba(236,72,153,.9);">
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>
            <span data-en="Collected light" data-fa="نورِ جمع‌شده"></span>
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>
          </span>
        </div>
        <h2 class="reveal font-serif" style="margin-top:1rem; font-size:3rem; transition-delay:.08s;" data-en="Photo Gallery" data-fa="گالری عکس"></h2>
        <p class="reveal" style="margin-top:1rem; font-size:.875rem; opacity:.65; transition-delay:.16s;" data-en="Small fragments of beauty I never want to forget." data-fa="تکه‌های کوچیکی از زیبایی که هیچ‌وقت نمی‌خوام فراموششون کنم."></p>
      </div>
      <div id="galleryGrid" class="masonry" style="margin-top:3.5rem;"></div>
    </div>
  </section>

  <!-- STORIES -->
  <section id="stories" style="position:relative; padding:6rem 1rem; scroll-margin-top:6rem;">
    <div style="max-width:72rem; margin:0 auto;">
      <div style="text-align:center; max-width:42rem; margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex; align-items:center; gap:.75rem; font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:rgba(236,72,153,.9);">
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>
            <span data-en="A day in frames" data-fa="یک روز در قاب"></span>
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>
          </span>
        </div>
        <h2 class="reveal font-serif" style="margin-top:1rem; font-size:3rem; transition-delay:.08s;" data-en="Stories" data-fa="استوری‌ها"></h2>
        <p class="reveal" style="margin-top:1rem; font-size:.875rem; opacity:.65; transition-delay:.16s;" data-en="Tap a circle to step into a moment." data-fa="روی یه دایره بزن و وارد یه لحظه شو."></p>
      </div>
      <div id="storiesRow" class="no-scrollbar reveal" style="margin-top:3rem; display:flex; gap:1rem; overflow-x:auto; padding:0 .5rem 1rem;"></div>
    </div>
  </section>

  <!-- MOMENTS -->
  <section id="moments" style="position:relative; padding:6rem 1rem; scroll-margin-top:6rem;">
    <div style="max-width:72rem; margin:0 auto;">
      <div style="text-align:center; max-width:42rem; margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex; align-items:center; gap:.75rem; font-size:10px; letter-spacing:.32em; text-transform:uppercase; color:rgba(236,72,153,.9);">
            <span style="height:1px; width:32px; background:currentColor; opacity:.4;"></span>

        <span style="padding:3px; border-radius:9999px; background:linear-gradient(135deg,#f0a6c6,#b98ce4,#8fb9e8); display:inline-block; transition:transform .3s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
          <span style="display:block; padding:3px; border-radius:9999px; background:var(--bg);">
            <img src="${U(s.p,220)}" alt="" style="width:76px; height:76px; border-radius:9999px; object-fit:cover; display:block;">
          </span>
        </span>
        <span style="font-size:11px; opacity:.75; max-width:86px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${lang==='fa'?s.nameFa:s.nameEn}</span>
      </button>`).join('');
    $$('.story-btn').forEach(btn => {
      btn.addEventListener('click', () => openStory(parseInt(btn.dataset.index)));
    });
  }

  function renderMoments() {
    $('#momentsGrid').innerHTML = MOMENTS.map(m => {
      const spanStyle = m.span === 2 ? 'grid-column: span 2;' : '';
      const styleAttr = `style="${spanStyle}"`;
      if (m.type === 'image') {
        return `<div class="reveal" ${styleAttr}>
          <div style="position:relative; overflow:hidden; border-radius:1.6rem; height:280px; box-shadow:0 10px 30px -12px rgba(0,0,0,.2);">
            <img src="${U(m.p,900)}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
            <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(20,8,28,.72), transparent 60%);"></div>
            <p class="font-serif" style="position:absolute; bottom:0; left:0; right:0; padding:1.25rem; margin:0; color:white; font-size:1.125rem; line-height:1.3;">${lang==='fa'?m.fa:m.en}</p>
          </div>
        </div>`;
      }
      if (m.type === 'quote') {
        return `<div class="reveal" ${styleAttr}>
          <div class="glass" style="position:relative; border-radius:1.6rem; padding:2rem; min-height:190px; display:flex; align-items:center; overflow:hidden;">
            <span class="font-serif" style="position:absolute; top:-1rem; left:1rem; font-size:4rem; opacity:.15; user-select:none;">"</span>
            <p class="font-serif" style="position:relative; margin:0; font-size:1.375rem; line-height:1.3; font-style:italic;">${lang==='fa'?m.fa:m.en}</p>
          </div>
        </div>`;
      }
      return `<div class="reveal" ${styleAttr}>
        <div class="glass" style="border-radius:1.6rem; padding:1.75rem; min-height:190px; display:flex; flex-direction:column; justify-content:center;">
          <span style="color:#ec4899; margin-bottom:.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.85 4.95L18.8 10l-4.95 1.85L12 16.8l-1.85-4.95L5.2 10l4.95-1.85z"/></svg>
          </span>
          <p style="margin:0; font-size:.875rem; line-height:1.7; opacity:.8;">${lang==='fa'?m.fa:m.en}</p>
        </div>
      </div>`;
    }).join('');
    observeReveals();
  }

  function renderNav() {
    const container = $('#navBar');
    container.innerHTML = NAV.map(n => `
      <button class="nav-btn" data-target="${n.id}" style="position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:.5rem .625rem; border-radius:1rem; border:none; background:transparent; cursor:pointer; color:inherit; opacity:.6; transition:all .3s;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg>
        <span style="font-size:9px; letter-spacing:.05em; white-space:nowrap;">${lang==='fa'?n.fa:n.en}</span>
      </button>`).join('');
    $$('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.target;
        document.getElementById(t).scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
    updateActiveNav();
  }

  /* ═══════════ SCROLL SPY ═══════════ */
  function updateActiveNav() {
    const ids = NAV.map(n => n.id);
    let active = 'home';
    const y = window.scrollY + window.innerHeight * 0.35;
    for (const id of ids) {
      const el = document.getElementById(id);
      if (el && el.offsetTop <= y) active = id;
    }
    $$('.nav-btn').forEach(btn => {
      const on = btn.dataset.target === active;
      btn.style.opacity = on ? '1' : '.6';
      btn.style.color = on ? 'white' : '';
      btn.style.background = on ? 'linear-gradient(135deg,#f0a6c6,#b98ce4)' : 'transparent';
      btn.style.boxShadow = on ? '0 8px 22px -6px rgba(200,130,200,.7)' : 'none';
    });
  }

  /* ═══════════ REVEAL OBSERVER ═══════════ */
  let revealObserver = null;
  function observeReveals() {
    if (!('IntersectionObserver' in window)) {
      $$('.reveal').forEach(el => el.classList.add('in'));
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('in'); revealObserver.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    }
    $$('.reveal:not(.in)').forEach(el => revealObserver.observe(el));
  }

  /* ═══════════ LIGHTBOX ═══════════ */
  let lightboxIndex = null;
  function openLightbox(i) { lightboxIndex = i; showLightbox(i); $('#lightbox').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
  function showLightbox(i) {
    const g = GALLERY[i];
    $('#lbImg').src = U(g.p, 1400);
    $('#lbCaption').textContent = lang === 'fa' ? g.fa : g.en;
    $('#lbCounter').textContent = `${i+1} / ${GALLERY.length}`;
  }
  function closeLightbox() { lightboxIndex = null; $('#lightbox').style.display = 'none'; document.body.style.overflow = ''; }
  function lbNext() { if (lightboxIndex === null) return; lightboxIndex = (lightboxIndex + 1) % GALLERY.length; showLightbox(lightboxIndex); }
  function lbPrev() { if (lightboxIndex === null) return; lightboxIndex = (lightboxIndex - 1 + GALLERY.length) % GALLERY.length; showLightbox(lightboxIndex); }

  /* ═══════════ STORY VIEWER ═══════════ */
  let storyIndex = null;
  let storyTimer = null;
  const STORY_DUR = 5200;

  function openStory(i) { storyIndex = i; showStory(i, true); $('#storyViewer').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
  function showStory(i, resetTimer = true) {
    const s = STORIES[i];
    $('#stImg').src = U(s.p, 900);
    $('#stAvatar').src = U(s.p, 120);
    $('#stName').textContent = lang === 'fa' ? s.nameFa : s.nameEn;
    $('#stTitle').textContent = lang === 'fa' ? s.titleFa : s.titleEn;
    $('#stText').textContent = lang === 'fa' ? s.textFa : s.textEn;
    const bars = STORIES.map((_, idx) => {
      if (idx < i) return '<div style="flex:1; height:2.5px; border-radius:9999px; background:white; overflow:hidden;"></div>';
      if (idx === i) return `<div style="flex:1; height:2.5px; border-radius:9999px; background:rgba(255,255,255,.3); overflow:hidden;"><div class="story-bar" style="height:100%; width:0; background:white; border-radius:9999px; animation-duration:${STORY_DUR}ms;"></div></div>`;
      return '<div style="flex:1; height:2.5px; border-radius:9999px; background:rgba(255,255,255,.3); overflow:hidden;"></div>';
    }).join('');
    $('#stProgress').innerHTML = bars;
    if (resetTimer) {
      clearTimeout(storyTimer);
      storyTimer = setTimeout(storyNext, STORY_DUR);
    }
  }
  function storyNext() { if (storyIndex === null) return; if (storyIndex < STORIES.length - 1) { storyIndex++; showStory(storyIndex); } else closeStory(); }
  function storyPrev() { if (storyIndex === null) return; if (storyIndex > 0) { storyIndex--; showStory(storyIndex); } }
  function closeStory() { storyIndex = null; clearTimeout(storyTimer); $('#storyViewer').style.display = 'none'; document.body.style.overflow = ''; }

  /* ═══════════ MUSIC (Web Audio) ═══════════ */
  const audio = {
    ctx: null, master: null, analyser: null, raf: null, playing: false, vol: 0.4,
  };

  function buildAudio() {
    if (audio.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const master = ctx.createGain(); master.gain.value = 0;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 950; filter.Q.value = 0.4;
    const analyser = ctx.createAnalyser(); analyser.fftSize = 64; analyser.smoothingTimeConstant = 0.85;
    master.connect(filter); filter.connect(analyser); analyser.connect(ctx.destination);
    const freqs = [130.81, 164.81, 196.00, 246.94, 261.63];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (i - 2) * 3;
      const g = ctx.createGain(); g.gain.value = 0.07 / freqs.length;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.04 + i * 0.013;
      const lg = ctx.createGain(); lg.gain.value = 0.03 / freqs.length;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      osc.connect(g); g.connect(master); osc.start();
    });
    audio.ctx = ctx; audio.master = master; audio.analyser = analyser;
  }

  function drawViz() {
    if (!audio.analyser) return;
    const data = new Uint8Array(audio.analyser.frequencyBinCount);
    audio.analyser.getByteFrequencyData(data);
    const bars = $$('#viz span');
    bars.forEach((bar, i) => {
      const idx = Math.floor((i / bars.length) * data.length * 0.8);
      const target = Math.max(0.08, (data[idx] / 255) * 1.5);
      bar.style.height = Math.max(8, target * 100) + '%';
    });
    audio.raf = requestAnimationFrame(drawViz);
  }

  function togglePlay() {
    buildAudio();
    if (!audio.ctx) return;
    if (!audio.playing) {
      audio.ctx.resume();
      audio.master.gain.setTargetAtTime(audio.vol, audio.ctx.currentTime, 0.7);
      audio.playing = true;
      $('#playBtn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14M15 5v14"/></svg>';
      if (!audio.raf) drawViz();
    } else {
      audio.master.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.25);
      audio.playing = false;
      $('#playBtn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.2 19 12 8 18.8z" fill="currentColor" stroke="none"/></svg>';
      if (audio.raf) { cancelAnimationFrame(audio.raf); audio.raf = null; }
      $$('#viz span').forEach(b => b.style.height = '8%');
    }
  }

  function initViz() {
    const viz = $('#viz');
    let html = '';
    for (let i = 0; i < 20; i++) {
      html += `<span style="flex:1; height:8%; border-radius:9999px; background:linear-gradient(to top,#f0a6c6,#b98ce4); opacity:.35; transition:height .12s ease, opacity .4s;"></span>`;
    }
    viz.innerHTML = html;
  }

  /* ═══════════ LOADER ═══════════ */
  function initLoader() {
    // letters
    const letters = 'REYHANEH'.split('');
    $('#loaderLetters').innerHTML = letters.map((c, i) =>
      `<span style="display:inline-block; animation:floatY 3s ease-in-out ${i*0.09}s infinite;">${c}</span>`
    ).join('');

    // particles
    const partContainer = $('#loaderParticles');
    for (let i = 0; i < 26; i++) {
      const span = document.createElement('span');
      const size = 2 + Math.random() * 4;
      span.style.cssText = `position:absolute; left:${Math.random()*100}%; top:${Math.random()*100}%; width:${size}px; height:${size}px; border-radius:9999px; background:linear-gradient(135deg,#f0a6c6,#b98ce4); animation:twinkle ${3+Math.random()*4}s ease-in-out ${Math.random()*4}s infinite;`;
      partContainer.appendChild(span);
    }

    // progress
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 11 + 6;
      if (p >= 100) {
        p = 100;
        clearInterval(iv);
        setTimeout(() => {
          $('#loader').classList.add('exit');
          setTimeout(() => { $('#loader').style.display = 'none'; }, 1400);
        }, 450);
      }
      $('#loaderBar').style.width = Math.min(p, 100) + '%';
      $('#loaderPct').textContent = String(Math.round(Math.min(p, 100))).padStart(3, '0') + '%';
    }, 85);
  }

  /* ═══════════ INIT ═══════════ */
  function init() {
    // images
    $('#heroImg').src = IMG.portrait;
    $('#aboutImg').src = IMG.about;

    // theme + lang
    setTheme(theme);
    setLang(lang);

    // loader
    initLoader();

    // music viz
    initViz();

    // buttons
    $('#langBtn').addEventListener('click', () => setLang(lang === 'fa' ? 'en' : 'fa'));
    $('#themeBtn').addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
    $('#exploreBtn').addEventListener('click', () => document.getElementById('about').scrollIntoView({ behavior:'smooth' }));

    // music
    $('#musicToggle').addEventListener('click', () => {
      const panel = $('#musicPanel');
      const open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
    });
    $('#playBtn').addEventListener('click', togglePlay);
    $('#volRange').addEventListener('input', (e) => {
      audio.vol = parseFloat(e.target.value);
      if (audio.ctx && audio.playing) {
        audio.master.gain.setTargetAtTime(audio.vol, audio.ctx.currentTime, 0.1);
      }
    });

    // lightbox
    $('#lbClose').addEventListener('click', closeLightbox);
    $('#lbPrev').addEventListener('click', (e) => { e.stopPropagation(); lbPrev(); });
    $('#lbNext').addEventListener('click', (e) => { e.stopPropagation(); lbNext(); });
    $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

    // story viewer
    $('#stClose').addEventListener('click', closeStory);
    $('#stPrevBtn').addEventListener('click', storyPrev);
    $('#stNextBtn').addEventListener('click', storyNext);

    // keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeLightbox(); closeStory(); }
      if (lightboxIndex !== null) {
        if (e.key === 'ArrowRight') lbNext();
        if (e.key === 'ArrowLeft') lbPrev();
      }
      if (storyIndex !== null) {
        if (e.key === 'ArrowRight') storyNext();
        if (e.key === 'ArrowLeft') storyPrev();
      }
    });

    // scroll
    window.addEventListener('scroll', updateActiveNav, { passive: true });
    window.addEventListener('resize', updateActiveNav);

    // reveal
    observeReveals();

    // touch swipe on lightbox/story
    addSwipe(document.getElementById('storyFrame'), storyNext, storyPrev);
    addSwipe(document.getElementById('lightbox'), lbNext, lbPrev);
  }

  function addSwipe(el, onNext, onPrev) {
    if (!el) return;
    let x0 = null;
    el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) { dx < 0 ? onNext() : onPrev(); }
      x0 = null;
    }, { passive: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
