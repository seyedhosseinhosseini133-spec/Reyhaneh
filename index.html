<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reyhaneh — My Little World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#fdf8f6;--fg:#2b2330;--glass-bg:rgba(255,255,255,.55);--glass-bd:rgba(255,255,255,.75);--glass-sh:0 10px 40px -12px rgba(170,120,170,.25)}
  html.dark{--bg:#0f0d16;--fg:#ece8f4;--glass-bg:rgba(32,27,45,.55);--glass-bd:rgba(255,255,255,.09);--glass-sh:0 10px 40px -12px rgba(0,0,0,.6)}
  *{box-sizing:border-box}html{scroll-behavior:smooth}
  body{font-family:'Manrope','Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--fg);transition:background-color .6s,color .6s;overflow-x:hidden;margin:0;min-height:100vh}
  [dir="rtl"] body{font-family:'Vazirmatn','Manrope',sans-serif}
  .font-serif,h1,h2,h3.serif{font-family:'Cormorant Garamond','Vazirmatn',serif}
  [dir="rtl"] .font-serif{font-family:'Vazirmatn',serif;letter-spacing:0!important}
  .glass{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-bd);box-shadow:var(--glass-sh)}
  .grad-text{background-image:linear-gradient(115deg,#e887b3 0%,#b98ce4 45%,#8fb9e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  html.dark .grad-text{background-image:linear-gradient(115deg,#ff9ec7 0%,#c9a4ff 45%,#a8cdff 100%)}
  .orb{position:fixed;border-radius:9999px;filter:blur(90px);opacity:.45;pointer-events:none;z-index:0;animation:floatBlob 22s ease-in-out infinite}
  html.dark .orb{opacity:.30}
  @keyframes floatBlob{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(24px,-30px,0) scale(1.07)}66%{transform:translate3d(-18px,16px,0) scale(.96)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes storyProg{from{width:0%}to{width:100%}}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  @keyframes musicPulse{0%{box-shadow:0 0 0 0 rgba(236,72,153,.45)}70%{box-shadow:0 0 0 14px rgba(236,72,153,0)}100%{box-shadow:0 0 0 0 rgba(236,72,153,0)}}
  .animate-float{animation:floatY 9s ease-in-out infinite}
  .animate-spin-slow{animation:spinSlow 26s linear infinite}
  .music-playing #musicToggle{animation:musicPulse 2.2s ease-out infinite}
  #loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 10%,rgba(244,190,214,.55),transparent 60%),radial-gradient(1000px 600px at 80% 90%,rgba(196,178,240,.55),transparent 60%),linear-gradient(160deg,#fdf8f6 0%,#f7eef7 50%,#eef1fb 100%);transition:opacity .9s ease,transform .9s ease}
  html.dark #loader{background:radial-gradient(1200px 600px at 20% 10%,rgba(120,60,110,.35),transparent 60%),radial-gradient(1000px 600px at 80% 90%,rgba(90,70,160,.35),transparent 60%),linear-gradient(160deg,#0f0d16 0%,#14101f 50%,#0d1020 100%)}
  #loader.exit{opacity:0;transform:scale(1.06);pointer-events:none}
  .about-grid{display:grid;grid-template-columns:1fr;gap:2rem;align-items:start}
  @media(min-width:900px){.about-grid{grid-template-columns:320px 1fr;gap:2.75rem}}
  .photography-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:640px){.photography-grid{grid-template-columns:repeat(3,1fr);gap:16px}}
  .photo-item{position:relative;display:block;overflow:hidden;border-radius:1.25rem;aspect-ratio:3/4;cursor:pointer;border:none;padding:0;background:transparent;box-shadow:0 14px 34px -18px rgba(90,40,100,.5)}
  .photo-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
  .photo-item:hover img{transform:scale(1.08)}
  .photo-cap{position:absolute;inset:auto 0 0 0;padding:1rem;background:linear-gradient(to top,rgba(20,8,28,.78),transparent);color:#fff;font-size:.8rem;letter-spacing:.04em;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
  .photo-item:hover .photo-cap{opacity:1;transform:translateY(0)}
  #storiesRow{display:flex;justify-content:center;gap:2.5rem;flex-wrap:wrap}
  .story-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:.65rem;border:none;background:transparent;cursor:pointer;padding:0}
  .story-ring{padding:3px;border-radius:9999px;background:linear-gradient(135deg,#f0a6c6,#b98ce4,#8fb9e8);display:inline-block;transition:transform .35s ease}
  .story-btn:hover .story-ring{transform:scale(1.06)}
  .story-ring-inner{display:block;padding:3px;border-radius:9999px;background:var(--bg)}
  .story-ring-inner img{width:96px;height:96px;border-radius:9999px;object-fit:cover;display:block}
  .story-name{font-size:12px;opacity:.8;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent}
  input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,#f0a6c6,#b98ce4)}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:999px;background:#fff;margin-top:-5px;box-shadow:0 2px 8px rgba(180,120,180,.45);cursor:pointer}
  input[type="range"]::-moz-range-track{height:4px;border-radius:999px;background:linear-gradient(90deg,#f0a6c6,#b98ce4)}
  input[type="range"]::-moz-range-thumb{height:14px;width:14px;border:none;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(180,120,180,.45);cursor:pointer}
  .reveal{opacity:0;transform:translate3d(0,26px,0);transition:opacity .95s cubic-bezier(.2,.7,.2,1),transform .95s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:translate3d(0,0,0)}
  .story-bar{animation-name:storyProg;animation-timing-function:linear;animation-fill-mode:forwards}
</style>
</head>
<body>

<div id="loader">
  <div id="loaderParticles" style="position:absolute;inset:0;overflow:hidden;"></div>
  <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:0 2rem;">
    <div style="position:relative;">
      <div style="position:absolute;inset:-2rem;border-radius:9999px;filter:blur(48px);opacity:.7;background:radial-gradient(circle,#f6bcd6,#c9a4ff 60%,transparent 75%);"></div>
      <div class="glass" style="position:relative;width:112px;height:112px;border-radius:9999px;display:grid;place-items:center;box-shadow:0 0 60px rgba(210,150,220,.45);">
        <span class="font-serif grad-text" style="font-size:3rem;font-weight:600;">R</span>
        <span class="animate-spin-slow" style="position:absolute;inset:-10px;border-radius:9999px;border:1px solid rgba(255,255,255,.6);border-top-color:transparent;border-right-color:transparent;"></span>
      </div>
    </div>
    <h1 style="margin-top:2.25rem;font-size:26px;letter-spacing:.42em;padding-left:.42em;" class="font-serif"><span id="loaderLetters"></span></h1>
    <p style="margin-top:.5rem;font-size:10px;letter-spacing:.35em;text-transform:uppercase;opacity:.5;">my little world</p>
    <div style="margin-top:2.5rem;width:224px;height:3px;border-radius:9999px;overflow:hidden;background:rgba(0,0,0,.1);">
      <div id="loaderBar" style="height:100%;border-radius:9999px;width:0%;background:linear-gradient(90deg,#f0a6c6,#b98ce4,#8fb9e8);transition:width .2s ease-out;"></div>
    </div>
    <div id="loaderPct" style="margin-top:.75rem;font-size:11px;letter-spacing:.25em;opacity:.6;font-variant-numeric:tabular-nums;">000%</div>
  </div>
</div>

<div class="orb" style="width:420px;height:420px;top:-8%;left:-8%;background:#f6bcd6;"></div>
<div class="orb" style="width:380px;height:380px;top:28%;right:-10%;background:#c9a4ff;animation-delay:-6s;"></div>
<div class="orb" style="width:460px;height:460px;bottom:-12%;left:18%;background:#a8cdff;animation-delay:-12s;"></div>

<header style="position:fixed;top:0;left:0;right:0;z-index:50;padding:1rem 1rem 0;pointer-events:none;">
  <div style="max-width:72rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
    <div class="glass" style="pointer-events:auto;width:44px;height:44px;border-radius:1rem;display:grid;place-items:center;">
      <span class="font-serif grad-text" style="font-size:1.25rem;font-weight:600;">R</span>
    </div>
    <div style="pointer-events:auto;display:flex;align-items:center;gap:.5rem;">
      <button id="langBtn" class="glass" style="height:44px;padding:0 .875rem;border-radius:1rem;display:flex;align-items:center;gap:.5rem;font-size:11px;font-weight:500;letter-spacing:.1em;cursor:pointer;color:inherit;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3.2 2.6 14.8 0 18M12 3c-2.6 3.2-2.6 14.8 0 18"/></svg>
        <span id="langLabel">فا</span>
      </button>
      <button id="themeBtn" class="glass" aria-label="Toggle theme" style="width:44px;height:44px;border-radius:1rem;display:grid;place-items:center;cursor:pointer;color:inherit;">
        <span id="themeIcon" style="display:inline-block;transition:transform .6s cubic-bezier(.5,-.3,.3,1.4);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2M12 19.8v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.2 12h2M19.8 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </div>
</header>

<main style="position:relative;z-index:10;">

  <section id="home" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7rem 1.5rem 8rem;scroll-margin-top:6rem;">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:48rem;width:100%;">
      <div class="reveal" style="transition-delay:.06s;">
        <div class="glass" style="display:inline-flex;align-items:center;gap:.5rem;padding:.375rem 1rem;border-radius:9999px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;">
          <span style="width:6px;height:6px;border-radius:9999px;background:#f472b6;animation:pulse 2s infinite;"></span>
          <span data-en="Photographer · Digital Diary" data-fa="عکاس · دفتر خاطرات دیجیتال"></span>
        </div>
      </div>
      <div class="reveal animate-float" style="margin-top:2.25rem;position:relative;width:160px;height:160px;transition-delay:.16s;">
        <div style="position:absolute;inset:0;border-radius:9999px;filter:blur(24px);opacity:.6;background:radial-gradient(circle,#f6bcd6,#c9a4ff 60%,transparent 75%);"></div>
        <div class="animate-spin-slow" style="position:absolute;inset:-14px;border-radius:9999px;border:1px dashed rgba(244,114,182,.5);"></div>
        <img id="heroImg" alt="Reyhaneh" style="position:relative;width:100%;height:100%;object-fit:cover;border-radius:9999px;box-shadow:0 0 0 4px rgba(255,255,255,.8),0 25px 50px -12px rgba(0,0,0,.25);" />
      </div>
      <div class="reveal" style="margin-top:1.75rem;display:flex;align-items:center;gap:.75rem;transition-delay:.26s;">
        <span style="height:1px;width:32px;background:linear-gradient(to right,transparent,rgba(244,114,182,.6));"></span>
        <span id="heroName" style="font-size:11px;letter-spacing:.42em;text-transform:uppercase;opacity:.7;"></span>
        <span style="height:1px;width:32px;background:linear-gradient(to left,transparent,rgba(244,114,182,.6));"></span>
      </div>
      <h1 class="reveal font-serif" style="margin-top:1rem;font-size:2.6rem;line-height:1.08;transition-delay:.34s;">
        <span data-en="Welcome to" data-fa="به دنیای کوچک من"></span>
        <span class="grad-text" style="font-style:italic;" data-en="My Little World" data-fa="خوش اومدی"></span>
      </h1>
      <p class="reveal" style="margin-top:1.5rem;font-size:.875rem;line-height:1.7;opacity:.7;max-width:36rem;transition-delay:.44s;" data-en="A photographer's soft little corner of the internet — where light, memories and favourite frames quietly live." data-fa="یه گوشهٔ نرم از اینترنت برای یک عکاس — جایی که نور، خاطره‌ها و قاب‌های موردعلاقه‌ام آروم زندگی می‌کنن."></p>
      <button id="exploreBtn" class="reveal" style="margin-top:2.25rem;display:inline-flex;align-items:center;gap:.625rem;padding:.875rem 1.75rem;border-radius:9999px;font-size:.875rem;font-weight:500;color:white;border:none;cursor:pointer;background:linear-gradient(135deg,#f0a6c6,#b98ce4);box-shadow:0 14px 34px -12px rgba(200,130,200,.85);transition-delay:.54s;">
        <span data-en="Explore My World" data-fa="دنیای منو بگرد"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></svg>
      </button>
      <div class="reveal" style="margin-top:3.5rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:.45;transition-delay:.7s;">
        <span style="font-size:9px;letter-spacing:.3em;text-transform:uppercase;" data-en="Scroll to discover" data-fa="اسکرول کن و کشف کن"></span>
        <span style="width:1px;height:36px;background:linear-gradient(to bottom,currentColor,transparent);animation:floatY 2.4s ease-in-out infinite;"></span>
      </div>
    </div>
  </section>

  <section id="about" style="position:relative;padding:6rem 1.5rem;scroll-margin-top:6rem;">
    <div style="max-width:72rem;margin:0 auto;">
      <div style="text-align:center;max-width:42rem;margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex;align-items:center;gap:.75rem;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(236,72,153,.9);">
            <span style="height:1px;width:32px;background:currentColor;opacity:.4;"></span>
            <span data-en="Who I am" data-fa="من کی‌ام"></span>
            <span style="height:1px;width:32px;background:currentColor;opacity:.4;"></span>
          </span>
        </div>
        <h2 class="reveal font-serif" style="margin-top:1rem;font-size:3rem;transition-delay:.08s;"><span data-en="About Me" data-fa="دربارهٔ من"></span></h2>
      </div>
      <div class="about-grid" style="margin-top:3.5rem;">
        <div class="reveal" style="position:relative;transition-delay:.06s;">
          <div style="position:absolute;inset:-14px;border-radius:2rem;filter:blur(26px);opacity:.45;background:linear-gradient(135deg,#f6bcd6,#c9a4ff);"></div>
          <div class="animate-spin-slow" style="position:absolute;inset:-10px;border-radius:1.75rem;border:1px dashed rgba(244,114,182,.35);"></div>
          <img id="aboutImg" alt="about" style="position:relative;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:1.75rem;box-shadow:0 20px 40px -12px rgba(0,0,0,.22);" />
          <div class="glass animate-float" style="position:absolute;bottom:-1.25rem;right:-.75rem;border-radius:1rem;padding:.65rem .9rem;display:flex;align-items:center;gap:.55rem;">
            <span style="color:#ec4899;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2S4.6 15.7 4.6 10.3A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.4 2.9c0 5.4-7.4 9.9-7.4 9.9z"/></svg></span>
            <span style="font-size:11px;line-height:1.2;opacity:.8;" data-en="little things, big joy" data-fa="چیزهای کوچک، شادی بزرگ"></span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:1.25rem;">
          <p class="reveal font-serif" style="font-size:1.75rem;line-height:1.3;margin:0;transition-delay:.12s;" data-en="I'm Reyhaneh — a photographer, a dreamer, and a collector of small beautiful things." data-fa="من ریحانه‌ام — یک عکاس، یک رؤیاپرداز و جمع‌کنندهٔ چیزهای کوچک و زیبا."></p>
          <p class="reveal" style="font-size:.9375rem;line-height:1.75;opacity:.7;margin:0;transition-delay:.18s;" data-en="Photography is how I slow the world down. I chase soft light, honest moments and the quiet poetry hiding in everyday life. This space is where I keep the frames and feelings that make my world feel warm." data-fa="عکاسی راهی‌ست که دنیا رو آروم‌تر می‌کنم. دنبال نور ملایم، لحظه‌های صادق و شعرِ آرومِ پنهون توی زندگی روزمره‌ام. این فضا جاییه که قاب‌ها و حس‌هایی که دنیامو گرم می‌کنن نگه می‌دارم."></p>
          <div class="reveal glass" style="border-radius:1.5rem;padding:1.5rem;transition-delay:.24s;">
            <h3 style="font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.55;margin:0 0 1rem 0;" data-en="Little things I love" data-fa="چیزهای کوچیکی که دوست دارم"></h3>
            <div id="interests" style="display:flex;flex-wrap:wrap;gap:.5rem;"></div>
          </div>
          <div class="reveal glass" style="border-radius:1.5rem;padding:1.5rem;transition-delay:.30s;">
            <h3 style="font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.55;margin:0 0 1rem 0;" data-en="Favourites" data-fa="موردعلاقه‌ها"></h3>
            <div id="favorites" style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;"></div>
          </div>
          <div class="reveal" style="position:relative;border-radius:1.5rem;padding:1.5rem 1.75rem;overflow:hidden;background:linear-gradient(135deg,rgba(240,166,198,.28),rgba(185,140,228,.28));transition-delay:.36s;">
            <span class="font-serif" style="position:absolute;top:-.75rem;left:1rem;font-size:3.75rem;opacity:.25;user-select:none;">"</span>
            <p class="font-serif" style="position:relative;font-size:1.125rem;font-style:italic;line-height:1.6;margin:0;" data-en="I photograph to remember that beauty is everywhere — if you slow down enough to notice." data-fa="عکاسی می‌کنم تا یادم بمونه زیبایی همه‌جا هست — اگر به‌قدر کافی آرام بشی تا ببینیش."></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="photography" style="position:relative;padding:6rem 1rem;scroll-margin-top:6rem;">
    <div style="max-width:72rem;margin:0 auto;">
      <div style="text-align:center;max-width:42rem;margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex;align-items:center;gap:.75rem;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(236,72,153,.9);">
            <span style="height:1px;width:32px;background:currentColor;opacity:.4;"></span>
            <span data-en="Through my lens" data-fa="از دریچهٔ دوربینم"></span>
            <span style="height:1px;width:32px;background:currentColor;opacity:.4;"></span>
          </span>
        </div>
        <h2 class="reveal font-serif" style="margin-top:1rem;font-size:3rem;transition-delay:.08s;" data-en="Photography" data-fa="عکاسی"></h2>
        <p class="reveal" style="margin-top:1rem;font-size:.875rem;opacity:.65;transition-delay:.16s;" data-en="Selected frames — light, stillness and small wonders." data-fa="قاب‌های انتخاب‌شده — نور، سکون و شگفتی‌های کوچک."></p>
      </div>
      <div id="photoGrid" class="photography-grid" style="margin-top:3.5rem;"></div>
    </div>
  </section>

  <section id="stories" style="position:relative;padding:6rem 1rem;scroll-margin-top:6rem;">
    <div style="max-width:72rem;margin:0 auto;">
      <div style="text-align:center;max-width:42rem;margin:0 auto;">
        <div class="reveal">
          <span style="display:inline-flex;align-items:center;gap:.75rem;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(236,72,153,.9);">
            <span style="height:1px;width:32px;background:currentColor;opacity:.4;"></span>
            <span data-en="A day in frames" data-fa="یک روز در قاب"></span>
            <span style="height:1px;width:32px;background:currentColor;opacity:.4;"></span>
          </span>
        </div>
        <h2 class="reveal font-serif" style="margin-top:1rem;font-size:3rem;transition-delay:.08s;" data-en="Stories" data-fa="استوری‌ها"></h2>
        <p class="reveal" style="margin-top:1rem;font-size:.875rem;opacity:.65;transition-delay:.16s;" data-en="Tap a circle to step into a moment." data-fa="روی یه دایره بزن و وارد یه لحظه شو."></p>
      </div>
      <div id="storiesRow" class="reveal" style="margin-top:3rem;padding:0 .5rem 1rem;"></div>
    </div>
  </section>
</main>

<footer style="position:relative;z-index:10;padding:2.5rem 1.5rem 7rem;text-align:center;">
  <div style="max-width:28rem;margin:0 auto;">
    <div style="display:flex;align-items:center;justify-content:center;gap:.5rem;color:rgba(244,114,182,.8);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2S4.6 15.7 4.6 10.3A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.4 2.9c0 5.4-7.4 9.9-7.4 9.9z"/></svg>
      <span style="height:1px;width:40px;background:currentColor;opacity:.3;"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.85 4.95L18.8 10l-4.95 1.85L12 16.8l-1.85-4.95L5.2 10l4.95-1.85z"/></svg>
      <span style="height:1px;width:40px;background:currentColor;opacity:.3;"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2S4.6 15.7 4.6 10.3A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.4 2.9c0 5.4-7.4 9.9-7.4 9.9z"/></svg>

    <p style="margin:.75rem 0 0 0;font-size:11px;letter-spacing:.05em;opacity:.5;" data-en="Made with love, light and a little bit of lavender." data-fa="با عشق، نور و کمی یاسی ساخته شد."></p>
    <p class="font-serif" style="margin:.25rem 0 0 0;font-size:.875rem;opacity:.4;">© 2025 Reyhaneh</p>
  </div>
</footer>

<nav style="position:fixed;bottom:1rem;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 .75rem;padding-bottom:env(safe-area-inset-bottom);pointer-events:none;">
  <div class="glass" id="navBar" style="border-radius:22px;padding:6px;display:flex;align-items:center;gap:2px;pointer-events:auto;box-shadow:0 18px 50px -18px rgba(150,100,170,.55);"></div>

<div id="musicWrap" style="position:fixed;bottom:6rem;left:1rem;z-index:50;">
  <div id="musicPanel" class="glass" style="display:block;border-radius:1.5rem;padding:1rem;width:236px;margin-bottom:.75rem;">
    <div style="display:flex;align-items:center;gap:.625rem;">
      <span style="width:36px;height:36px;border-radius:.75rem;display:grid;place-items:center;color:white;flex-shrink:0;background:linear-gradient(135deg,#f0a6c6,#b98ce4);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6.5l10-2V16"/><circle cx="6.6" cy="18" r="2.4"/><circle cx="16.6" cy="16" r="2.4"/></svg>
      </span>
      <div style="min-width:0;">
        <div style="font-size:12px;font-weight:500;" data-en="Soft Morning" data-fa="صبح آرام"></div>
        <div style="font-size:10px;opacity:.55;" data-en="Ambient No.1" data-fa="امبینت شمارهٔ ۱"></div>

    <audio id="bgMusic" src="https://cdn.imgurl.ir/uploads/s628_.mp3" loop preload="auto"></audio>
    <div style="margin-top:.75rem;display:flex;align-items:center;gap:.625rem;">
      <button id="playBtn" aria-label="Play/Pause" style="width:40px;height:40px;border-radius:9999px;display:grid;place-items:center;color:white;border:none;cursor:pointer;flex-shrink:0;background:linear-gradient(135deg,#f0a6c6,#b98ce4);box-shadow:0 8px 20px -8px rgba(200,130,200,.9);">
        <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.2 19 12 8 18.8z" fill="currentColor" stroke="none"/></svg>
      </button>
      <span style="color:rgba(236,72,153,.8);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3l4.5 3.8V5.7L7 9.5z"/><path d="M16 9.2a4 4 0 0 1 0 5.6M18.4 6.6a8 8 0 0 1 0 10.8"/></svg></span>
      <input id="volRange" type="range" min="0" max="1" step="0.01" value="0.4" style="flex:1;cursor:pointer;" aria-label="Volume">

  </div>
  <button id="musicToggle" class="glass" aria-label="Toggle music panel" style="width:48px;height:48px;border-radius:9999px;display:grid;place-items:center;cursor:pointer;position:relative;color:inherit;">
    <span style="color:rgba(236,72,153,.9);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6.5l10-2V16"/><circle cx="6.6" cy="18" r="2.4"/><circle cx="16.6" cy="16" r="2.4"/></svg></span>
  </button>

<div id="lightbox" style="display:none;position:fixed;inset:0;z-index:90;align-items:center;justify-content:center;padding:1rem;background:rgba(10,6,16,.82);backdrop-filter:blur(18px);">
  <button id="lbClose" class="glass" style="position:absolute;top:1.25rem;right:1.25rem;width:44px;height:44px;border-radius:9999px;display:grid;place-items:center;color:white;cursor:pointer;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button id="lbPrev" class="glass" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:9999px;display:grid;place-items:center;color:white;cursor:pointer;z-index:2;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="lbNext" class="glass" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:9999px;display:grid;place-items:center;color:white;cursor:pointer;z-index:2;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <figure style="position:relative;max-width:56rem;width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:1rem;" onclick="event.stopPropagation()">
    <img id="lbImg" alt="" style="max-height:72vh;width:auto;border-radius:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);object-fit:contain;">
    <figcaption style="text-align:center;color:rgba(255,255,255,.8);font-size:.875rem;">
      <span id="lbCaption"></span>
      <span id="lbCounter" style="display:block;margin-top:.25rem;font-size:10px;letter-spacing:.3em;opacity:.5;"></span>

<div id="storyViewer" style="display:none;position:fixed;inset:0;z-index:90;align-items:center;justify-content:center;background:rgba(8,5,12,.9);backdrop-filter:blur(16px);">
  <div style="position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:#000;" id="storyFrame">
    <img id="stImg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.78));"></div>
    <div id="stProgress" style="position:absolute;top:0;left:0;right:0;padding:.75rem;display:flex;gap:6px;z-index:20;" dir="ltr"></div>
    <div style="position:absolute;top:1.75rem;left:0;right:0;padding:0 1rem;display:flex;align-items:center;gap:.75rem;z-index:20;">
      <img id="stAvatar" alt="" style="width:32px;height:32px;border-radius:9999px;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.7);">
      <div style="flex:1;min-width:0;">
        <div id="stName" style="color:white;font-size:13px;font-weight:500;"></div>
        <div style="color:rgba(255,255,255,.5);font-size:10px;letter-spacing:.2em;text-transform:uppercase;">story</div>
      </div>
      <button id="stClose" style="width:36px;height:36px;border-radius:9999px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);display:grid;place-items:center;color:white;border:none;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

    <button id="stPrevBtn" style="position:absolute;top:0;bottom:0;left:0;width:32%;background:transparent;border:none;cursor:pointer;z-index:10;"></button>
    <button id="stNextBtn" style="position:absolute;top:0;bottom:0;right:0;width:68%;background:transparent;border:none;cursor:pointer;z-index:10;"></button>
    <div style="position:absolute;bottom:0;left:0;right:0;padding:1.5rem;z-index:20;pointer-events:none;">
      <h3 id="stTitle" class="font-serif" style="margin:0;font-size:1.5rem;color:white;line-height:1.2;"></h3>
      <p id="stText" style="margin:.5rem 0 0 0;color:rgba(255,255,255,.7);font-size:.75rem;line-height:1.6;"></p>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ═══════════ DATA — همه از CDN ═══════════ */
  const IMG = {
    portrait: 'https://cdn.imgurl.ir/uploads/c841252_.jpg',
    about:    'https://cdn.imgurl.ir/uploads/l408194_.jpg',
  };

  /* فقط ۳ عکس در گالری */
  const PHOTOGRAPHY = [
    { src:'https://cdn.imgurl.ir/uploads/c841252_.jpg', en:'Portrait',       fa:'پرتره' },
    { src:'https://cdn.imgurl.ir/uploads/l408194_.jpg', en:'A quiet frame',  fa:'قابی آرام' },
    { src:'https://cdn.imgurl.ir/uploads/i159582_.jpg', en:'Light, softly',  fa:'نورِ ملایم' },
  ];

  const STORIES = [
    {
      src:'https://cdn.imgurl.ir/uploads/l408194_.jpg',
      nameEn:'Frame I',  nameFa:'قاب اول',
      titleEn:'A quiet little frame',  titleFa:'یه قاب کوچکِ آرام',
      textEn:'A moment I wanted to keep exactly as it was.',
      textFa:'لحظه‌ای که می‌خواستم دقیقاً همون‌طور که بود نگهش دارم.'
    },
    {
      src:'https://cdn.imgurl.ir/uploads/i159582_.jpg',
      nameEn:'Frame II', nameFa:'قاب دوم',
      titleEn:'Light, softly held',    titleFa:'نور، آروم توی دست',
      textEn:'Soft light and a feeling that stays.',
      textFa:'نورِ ملایم و حسی که می‌مونه.'
    },
  ];

  const INTERESTS_EN = ['Photography','Poetry','Design','Nature','Coffee','Music','Slow mornings','Stargazing'];
  const INTERESTS_FA = ['عکاسی','شعر','طراحی','طبیعت','قهوه','موسیقی','صبح‌های آرام','تماشای ستاره‌ها'];
  const FAVORITES = [
    { kEn:'Season', kFa:'فصل',  vEn:'Autumn',      vFa:'پاییز' },
    { kEn:'Colour', kFa:'رنگ',  vEn:'Lavender',    vFa:'یاسی' },
    { kEn:'Flower', kFa:'گل',   vEn:'Peony',       vFa:'صدتومانی' },
    { kEn:'Hour',   kFa:'ساعت', vEn:'Golden hour', vFa:'طلایی' },
  ];

  const NAV = [
    { id:'home',        en:'Home',        fa:'خانه',   icon:'<path d="M3.5 10.6 12 3.5l8.5 7.1"/><path d="M5.5 9.6V20a.8.8 0 0 0 .8.8H10v-5.6h4v5.6h3.7a.8.8 0 0 0 .8-.8V9.6"/>' },
    { id:'about',       en:'About',       fa:'درباره', icon:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c0-4 3.4-6.8 7.5-6.8s7.5 2.8 7.5 6.8"/>' },
    { id:'photography', en:'Photography', fa:'عکاسی',  icon:'<rect x="3" y="3.5" width="18" height="17" rx="3.5"/><circle cx="8.5" cy="9" r="1.4"/><path d="m20.5 15.5-4.6-4.6L5.5 21"/>' },
    { id:'stories',     en:'Stories',     fa:'استوری', icon:'<circle cx="12" cy="12" r="9"/><path d="M10 8.4v7.2l6.2-3.6z" fill="currentColor" stroke="none"/>' },
  ];

  let lang = localStorage.getItem('rh-lang') || 'en';
  let theme = localStorage.getItem('rh-theme') || 'light';

  const $ = (s, c=document) => c.querySelector(s);
  const $$ = (s, c=document) => Array.from(c.querySelectorAll(s));

  function setLang(newLang) {
    lang = newLang;
    localStorage.setItem('rh-lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    $('#langLabel').textContent = lang === 'fa' ? 'EN' : 'فا';
    $$('[data-en]').forEach(el => {
      const v = el.getAttribute('data-' + lang);
      if (v) el.textContent = v;
    });
    renderInterests();
    renderFavorites();
    renderPhotography();
    renderStories();
    renderNav();
    if (lightboxIndex !== null) showLightbox(lightboxIndex);
    if (storyIndex !== null) showStory(storyIndex, false);
    observeReveals();
  }

  function setTheme(newTheme) {
    theme = newTheme;
    localStorage.setItem('rh-theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
    const icon = $('#themeIcon');
    icon.style.transform = theme === 'dark' ? 'rotate(0deg)' : 'rotate(180deg)';
    icon.innerHTML = theme === 'dark'
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 13.2A8.5 8.5 0 1 1 10.8 3.2a6.8 6.8 0 0 0 10 10z"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2M12 19.8v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.2 12h2M19.8 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/></svg>';
  }

  function renderInterests() {
    const list = lang === 'fa' ? INTERESTS_FA : INTERESTS_EN;
    $('#interests').innerHTML = list.map(t =>
      `<span style="border-radius:9999px;padding:.375rem .875rem;font-size:.75rem;border:1px solid rgba(244,182,210,.7);background:rgba(255,255,255,.5);display:inline-block;">${t}</span>`
    ).join('');
  }

  function renderFavorites() {
    $('#favorites').innerHTML = FAVORITES.map(f => `
      <div style="border-radius:1rem;padding:.75rem 1rem;background:linear-gradient(135deg,rgba(252,231,243,.7),rgba(237,233,254,.7));">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.55;">${lang==='fa'?f.kFa:f.kEn}</div>
        <div style="margin-top:.25rem;font-size:.875rem;font-weight:500;">${lang==='fa'?f.vFa:f.vEn}</div>
      </div>`).join('');
  }

  function renderPhotography() {
    $('#photoGrid').innerHTML = PHOTOGRAPHY.map((g,i) => `
      <button class="photo-item" data-index="${i}" aria-label="${g.en}">
        <img src="${g.src}" alt="" loading="lazy">
        <span class="photo-cap">${lang==='fa'?g.fa:g.en}</span>
      </button>`).join('');
    $$('.photo-item').forEach(btn => {
      btn.addEventListener('click', () => openLightbox(parseInt(btn.dataset.index)));
    });
  }

  function renderStories() {
    $('#storiesRow').innerHTML = STORIES.map((s,i) => `
      <button class="story-btn" data-index="${i}">
        <span class="story-ring">
          <span class="story-ring-inner">
            <img src="${s.src}" alt="">
          </span>
        </span>
        <span class="story-name">${lang==='fa'?s.nameFa:s.nameEn}</span>
      </button>`).join('');
    $$('.story-btn').forEach(btn => {
      btn.addEventListener('click', () => openStory(parseInt(btn.dataset.index)));
    });
  }

  function renderNav() {
    const container = $('#navBar');
    container.innerHTML = NAV.map(n => `
      <button class="nav-btn" data-target="${n.id}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.5rem .625rem;border-radius:1rem;border:none;background:transparent;cursor:pointer;color:inherit;opacity:.6;transition:all .3s;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg>
        <span style="font-size:9px;letter-spacing:.05em;white-space:nowrap;">${lang==='fa'?n.fa:n.en}</span>
      </button>`).join('');
    $$('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById(btn.dataset.target).scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
    updateActiveNav();
  }

  function updateActiveNav() {
    const ids = NAV.map(n => n.id);
    let active = 'home';
    const y = window.scrollY + window.innerHeight * 0.35;
    for (const id of ids) {
      const el = document.getElementById(id);
      if (el && el.offsetTop <= y) active = id;
    }
    $$('.nav-btn').forEach(btn => {
      const on = btn.dataset.target === active;
      btn.style.opacity = on ? '1' : '.6';
      btn.style.color = on ? 'white' : '';
      btn.style.background = on ? 'linear-gradient(135deg,#f0a6c6,#b98ce4)' : 'transparent';
      btn.style.boxShadow = on ? '0 8px 22px -6px rgba(200,130,200,.7)' : 'none';
    });
  }

  let revealObserver = null;
  function observeReveals() {
    if (!('IntersectionObserver' in window)) {
      $$('.reveal').forEach(el => el.classList.add('in'));
      return;
    }
    if (!revealObserver) {
      revealObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('in'); revealObserver.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    }
    $$('.reveal:not(.in)').forEach(el => revealObserver.observe(el));
  }

  let lightboxIndex = null;
  function openLightbox(i) { lightboxIndex = i; showLightbox(i); $('#lightbox').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
  function showLightbox(i) {
    const g = PHOTOGRAPHY[i];
    $('#lbImg').src = g.src;
    $('#lbCaption').textContent = lang === 'fa' ? g.fa : g.en;
    $('#lbCounter').textContent = `${i+1} / ${PHOTOGRAPHY.length}`;
  }
  function closeLightbox() { lightboxIndex = null; $('#lightbox').style.display = 'none'; document.body.style.overflow = ''; }
  function lbNext() { if (lightboxIndex === null) return; lightboxIndex = (lightboxIndex + 1) % PHOTOGRAPHY.length; showLightbox(lightboxIndex); }
  function lbPrev() { if (lightboxIndex === null) return; lightboxIndex = (lightboxIndex - 1 + PHOTOGRAPHY.length) % PHOTOGRAPHY.length; showLightbox(lightboxIndex); }

  let storyIndex = null, storyTimer = null;
  const STORY_DUR = 5200;

  function openStory(i) { storyIndex = i; showStory(i, true); $('#storyViewer').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
  function showStory(i, resetTimer = true) {
    const s = STORIES[i];
    $('#stImg').src = s.src;
    $('#stAvatar').src = s.src;
    $('#stName').textContent = lang === 'fa' ? s.nameFa : s.nameEn;
    $('#stTitle').textContent = lang === 'fa' ? s.titleFa : s.titleEn;
    $('#stText').textContent = lang === 'fa' ? s.textFa : s.textEn;
    $('#stProgress').innerHTML = STORIES.map((_, idx) => {
      if (idx < i) return '<div style="flex:1;height:2.5px;border-radius:9999px;background:white;overflow:hidden;"></div>';
      if (idx === i) return `<div style="flex:1;height:2.5px;border-radius:9999px;background:rgba(255,255,255,.3);overflow:hidden;"><div class="story-bar" style="height:100%;width:0;background:white;border-radius:9999px;animation-duration:${STORY_DUR}ms;"></div></div>`;
      return '<div style="flex:1;height:2.5px;border-radius:9999px;background:rgba(255,255,255,.3);overflow:hidden;"></div>';
    }).join('');
    if (resetTimer) { clearTimeout(storyTimer); storyTimer = setTimeout(storyNext, STORY_DUR); }
  }
  function storyNext() { if (storyIndex === null) return; if (storyIndex < STORIES.length - 1) { storyIndex++; showStory(storyIndex); } else closeStory(); }
  function storyPrev() { if (storyIndex === null) return; if (storyIndex > 0) { storyIndex--; showStory(storyIndex); } }
  function closeStory() { storyIndex = null; clearTimeout(storyTimer); $('#storyViewer').style.display = 'none'; document.body.style.overflow = ''; }

  const bgMusic    = $('#bgMusic');
  const playBtn    = $('#playBtn');
  const playIcon   = $('#playIcon');
  const volRange   = $('#volRange');
  const musicWrap  = $('#musicWrap');
  const musicPanel = $('#musicPanel');

  bgMusic.volume = parseFloat(volRange.value);
  bgMusic.loop = true;

  function updatePlayUI() {
    if (bgMusic.paused) {
      playIcon.innerHTML = '<path d="M8 5.2 19 12 8 18.8z" fill="currentColor" stroke="none"/>';
      musicWrap.classList.remove('music-playing');
    } else {
      playIcon.innerHTML = '<path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
      musicWrap.classList.add('music-playing');
    }
  }

  playBtn.addEventListener('click', () => {
    if (bgMusic.paused) bgMusic.play().catch(() => {});
    else bgMusic.pause();
  });
  bgMusic.addEventListener('play',  updatePlayUI);
  bgMusic.addEventListener('pause', updatePlayUI);
  volRange.addEventListener('input', (e) => { bgMusic.volume = parseFloat(e.target.value); });

  let autoplayStarted = false;
  function tryAutoplay() {
    if (autoplayStarted) return;
    autoplayStarted = true;
    const p = bgMusic.play();
    if (p && p.catch) {
      p.catch(() => {
        const startOnGesture = () => {
          bgMusic.play().catch(() => {});
          document.removeEventListener('click', startOnGesture);
          document.removeEventListener('touchstart', startOnGesture);
          document.removeEventListener('keydown', startOnGesture);
        };
        document.addEventListener('click', startOnGesture, { once: true });
        document.addEventListener('touchstart', startOnGesture, { once: true });
        document.addEventListener('keydown', startOnGesture, { once: true });
      });
    }
  }

  $('#musicToggle').addEventListener('click', () => {
    const isOpen = musicPanel.style.display !== 'none';
    musicPanel.style.display = isOpen ? 'none' : 'block';
  });

  function initLoader() {
    $('#loaderLetters').innerHTML = 'REYHANEH'.split('').map((c,i) =>
      `<span style="display:inline-block;animation:floatY 3s ease-in-out ${i*0.09}s infinite;">${c}</span>`
    ).join('');
    const pc = $('#loaderParticles');
    for (let i = 0; i < 26; i++) {
      const sp = document.createElement('span');
      const sz = 2 + Math.random() * 4;
      sp.style.cssText = `position:absolute;left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;border-radius:9999px;background:linear-gradient(135deg,#f0a6c6,#b98ce4);animation:twinkle ${3+Math.random()*4}s ease-in-out ${Math.random()*4}s infinite;`;
      pc.appendChild(sp);
    }
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random() * 11 + 6;
      if (p >= 100) {
        p = 100; clearInterval(iv);
        setTimeout(() => {
          $('#loader').classList.add('exit');
          setTimeout(() => { $('#loader').style.display = 'none'; }, 1400);
          tryAutoplay();
        }, 450);
      }
      $('#loaderBar').style.width = Math.min(p, 100) + '%';
      $('#loaderPct').textContent = String(Math.round(Math.min(p, 100))).padStart(3, '0') + '%';
    }, 85);
  }

  function init() {
    $('#heroImg').src = IMG.portrait;
    $('#aboutImg').src = IMG.about;

    setTheme(theme);
    setLang(lang);
    initLoader();

    $('#langBtn').addEventListener('click', () => setLang(lang === 'fa' ? 'en' : 'fa'));
    $('#themeBtn').addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
    $('#exploreBtn').addEventListener('click', () => document.getElementById('about').scrollIntoView({ behavior:'smooth' }));

    $('#lbClose').addEventListener('click', closeLightbox);
    $('#lbPrev').addEventListener('click', (e) => { e.stopPropagation(); lbPrev(); });
    $('#lbNext').addEventListener('click', (e) => { e.stopPropagation(); lbNext(); });
    $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

    $('#stClose').addEventListener('click', closeStory);
    $('#stPrevBtn').addEventListener('click', storyPrev);
    $('#stNextBtn').addEventListener('click', storyNext);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeLightbox(); closeStory(); }
      if (lightboxIndex !== null) {
        if (e.key === 'ArrowRight') lbNext();
        if (e.key === 'ArrowLeft') lbPrev();
      }
      if (storyIndex !== null) {
        if (e.key === 'ArrowRight') storyNext();
        if (e.key === 'ArrowLeft') storyPrev();
      }
    });

    window.addEventListener('scroll', updateActiveNav, { passive: true });
    window.addEventListener('resize', updateActiveNav);
    observeReveals();

    addSwipe(document.getElementById('storyFrame'), storyNext, storyPrev);
    addSwipe(document.getElementById('lightbox'), lbNext, lbPrev);

    tryAutoplay();
  }

  function addSwipe(el, onNext, onPrev) {
    if (!el) return;
    let x0 = null;
    el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) { dx < 0 ? onNext() : onPrev(); }
      x0 = null;
    }, { passive: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
